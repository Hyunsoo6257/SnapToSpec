name: QA Agent

on:
  schedule:
    - cron: "0 1 * * *" # 매일 오전 11시 Brisbane AEST (Feature Agent 완료 후 2시간 뒤)
  workflow_dispatch:

jobs:
  qa-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Configure git
        run: |
          git config user.email "162527916+Hyunsoo6257@users.noreply.github.com"
          git config user.name "Hyunsoo6257"

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Run QA Agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PROJECT_NAME: ${{ secrets.PROJECT_NAME }}
          NODE_ENV: ${{ secrets.NODE_ENV }}
          ALLOWED_CORS_ORIGIN: ${{ secrets.ALLOWED_CORS_ORIGIN }}
          FRONTEND_BASE_URL: ${{ secrets.FRONTEND_BASE_URL }}
        run: |
          claude --dangerously-skip-permissions --max-turns 120 -p "
          Read CLAUDE.md first.
          Then read tasks/qa-agent.md and follow all steps exactly.
          All output (commit messages, PR titles, PR descriptions) must be in English.
          "
