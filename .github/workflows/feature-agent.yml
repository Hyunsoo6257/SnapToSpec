name: Feature Agent

on:
  schedule:
    - cron: "0 0 * * 1-5" # 평일 오전 9시 KST (UTC 0시)
  workflow_dispatch:

jobs:
  feature-agent:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout dev branch
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Create feature branch
        run: |
          BRANCH="feat/agent-$(date +%Y%m%d)"
          git checkout -b $BRANCH
          echo "BRANCH=$BRANCH" >> $GITHUB_ENV

      - name: Run Feature Agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PROJECT_NAME: ${{ secrets.PROJECT_NAME }}
          NODE_ENV: ${{ secrets.NODE_ENV }}
          ALLOWED_CORS_ORIGIN: ${{ secrets.ALLOWED_CORS_ORIGIN }}
          FRONTEND_BASE_URL: ${{ secrets.FRONTEND_BASE_URL }}
        run: |
          claude --dangerously-skip-permissions -p "
          Read CLAUDE.md and PROJECT_PLAN.md first.
          Then read the current task file in tasks/ folder for today.
          Execute the task completely following all rules in CLAUDE.md.
          Commit with the branch name and push when done.
          " || true

      - name: Push branch
        run: |
          git config user.email "agent@snaptospec.com"
          git config user.name "Feature Agent"
          git push origin $BRANCH || true
