name: Bug Agent

on:
  schedule:
    - cron: "0 4 * * *" # 매일 오후 2시 Brisbane AEST (UTC+10 = UTC 04:00)
  workflow_dispatch:

jobs:
  bug-agent:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout dev branch
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Configure git
        run: |
          git config user.email "agent@snaptospec.com"
          git config user.name "Bug Agent"

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Create fix branch
        run: |
          BRANCH="fix/bug-agent-$(date +%Y%m%d)"
          git checkout -b $BRANCH
          echo "BRANCH=$BRANCH" >> $GITHUB_ENV

      - name: Run Bug Agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PROJECT_NAME: ${{ secrets.PROJECT_NAME }}
          NODE_ENV: ${{ secrets.NODE_ENV }}
          ALLOWED_CORS_ORIGIN: ${{ secrets.ALLOWED_CORS_ORIGIN }}
          FRONTEND_BASE_URL: ${{ secrets.FRONTEND_BASE_URL }}
        run: |
          claude --dangerously-skip-permissions -p "
          Read CLAUDE.md first.
          Then read tasks/bug-agent-daily.md and follow all steps exactly.
          All output (commit messages, comments) must be in English.
          Only commit if there are actual fixes. No empty commits.
          " || true

      - name: Push if changes exist
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git push origin $BRANCH
          else
            echo "No changes found, skipping push"
          fi
