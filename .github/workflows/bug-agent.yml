name: Bug Agent

on:
  workflow_dispatch:

jobs:
  bug-agent:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout today's feat branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve today's feat branch
        run: |
          FEAT_BRANCH="feat/agent-$(TZ='Australia/Brisbane' date +%Y%m%d)"
          if git ls-remote --exit-code --heads origin $FEAT_BRANCH 2>/dev/null; then
            echo "TARGET_BRANCH=$FEAT_BRANCH" >> $GITHUB_ENV
            git checkout $FEAT_BRANCH
            echo "Testing feat branch: $FEAT_BRANCH"
          else
            echo "TARGET_BRANCH=dev" >> $GITHUB_ENV
            git checkout dev
            echo "No feat branch for today — falling back to dev"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Configure git
        run: |
          git config user.email "agent@snaptospec.com"
          git config user.name "Bug Agent"

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Create fix branch
        run: |
          FIX_BRANCH="fix/bug-agent-$(TZ='Australia/Brisbane' date +%Y%m%d)"
          git checkout -b $FIX_BRANCH
          echo "FIX_BRANCH=$FIX_BRANCH" >> $GITHUB_ENV

      - name: Run Bug Agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PROJECT_NAME: ${{ secrets.PROJECT_NAME }}
          NODE_ENV: ${{ secrets.NODE_ENV }}
          ALLOWED_CORS_ORIGIN: ${{ secrets.ALLOWED_CORS_ORIGIN }}
          FRONTEND_BASE_URL: ${{ secrets.FRONTEND_BASE_URL }}
        run: |
          claude --dangerously-skip-permissions -p "
          Read CLAUDE.md first.
          Then read tasks/bug-agent-daily.md and follow all steps exactly.
          All output (commit messages, comments) must be in English.
          Only commit if there are actual fixes. No empty commits.
          " || true

      - name: Push if changes exist
        run: |
          if git log origin/$TARGET_BRANCH..$FIX_BRANCH 2>/dev/null | grep -q .; then
            git push origin $FIX_BRANCH
          else
            echo "No fixes made, skipping push"
          fi
