name: Review Agent

on:
  schedule:
    - cron: "0 8 * * *" # 매일 오후 6시 Brisbane AEST (UTC+10 = UTC 08:00)
  workflow_dispatch:

jobs:
  review-agent:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout dev branch
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Configure git
        run: |
          git config user.email "agent@snaptospec.com"
          git config user.name "Review Agent"

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Run Review Agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          claude --dangerously-skip-permissions -p "
          Read CLAUDE.md and tasks/review-agent-daily.md first.
          Check all open feat/* and fix/* branches.
          Review each branch against the checklist in review-agent-daily.md.
          For each passing branch: merge into dev AND create a PR with a clear summary of what was implemented.
          If today (Brisbane AEST) is Sunday: create a PR from dev to main as a weekly release.
          " || true
